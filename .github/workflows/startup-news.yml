name: Startup News to Discord

on:
  schedule:
    # 毎朝 7:17 JST（= 22:17 UTC）。GitHub側の混雑で数分〜十数分遅れることがあります
    - cron: "17 22 * * *"
  workflow_dispatch: {}   # Actions画面の「Run workflow」から手動実行もできる

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python news_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
